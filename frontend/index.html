<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <!-- Modern Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with Theme Toggle -->
        <header class="app-header">
            <div>
                <h1>Personal Finance Tracker</h1>
                <p class="subtitle">Track your income, expenses & savings</p>
            </div>
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Balance Overview Cards -->
        <div class="summary-grid">
            <div class="card balance-card">
                <h3>Total Balance</h3>
                <p id="total-balance">₹0.00</p>
            </div>
            <div class="card income-card">
                <h3>Income</h3>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Expense</h3>
                <p id="total-expense">₹0.00</p>
            </div>
        </div>

        <!-- Main Layout: Form + Chart -->
        <div class="main-grid">
            <!-- Add Transaction Form -->
            <div class="card form-card">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="text">Title</label>
                        <input type="text" id="text" placeholder="e.g. Salary, Rent" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="Enter amount" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
            </div>

            <!-- Expense Breakdown Chart/Analytics -->
            <div class="card chart-card">
                <h2>Overview</h2>
                <div class="chart-container">
                    <canvas id="expense-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="card history-card">
            <h2>Transaction History</h2>
            <ul id="transaction-list" class="transaction-list">
                <!-- Transactions will load dynamically -->
            </ul>
        </div>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
